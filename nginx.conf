server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Locations add their own Cache-Control; without merge nginx silently drops every server-level header below.
  add_header_inherit merge;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://ipi.eprostor.gov.si; connect-src 'self' https://tiles.openfreemap.org https://ipi.eprostor.gov.si; worker-src 'self' blob:; font-src 'self' data:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # .mjs (pdf.js worker) must be served as JavaScript, or module workers refuse to load
  types { application/javascript js mjs; text/css css; text/html html; image/svg+xml svg; image/png png; application/json json; application/manifest+json webmanifest; application/zip zip; application/pdf pdf; font/woff2 woff2; }

  # Service worker script must never be cached (browser or Cloudflare edge), or updates stall.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
